[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cybersec-bert-classifier"
version = "1.0.0"
description = "Cybersecurity text classification with a scalable baseline and optional BERT"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4"]
[project.optional-dependencies]
bert = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=2.7"]
topics = ["bertopic>=0.16"]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]

